name: Build iOS SwiftUI App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Compile SwiftUI App for iOS Simulator
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Xcode Project Wrapper & Build
        run: |
          # Swift packages can automatically generate an Xcode project structure for building
          swift package generate-xcodeproj
          
          # Build using the generated project and generic iOS simulator platform
          xcodebuild build \
            --project TipCalculatorApp.xcodeproj \
            --scheme TipCalculatorApp-Package \
            --sdk iphonesimulator \
            --destination "generic/platform=iOS Simulator"