name: Build iOS SwiftUI App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Compile iOS Target via Xcodebuild
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Swift Package for iOS Simulator
        run: |
          xcodebuild build -scheme TipCalculatorApp-Package -sdk iphonesimulator -destination "generic/platform=iOS Simulator"