name: Build iOS SwiftUI App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Compile Swift Package for iOS Simulator
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Swift Package for iOS Simulator
        run: |
          swift build \
            --sdk $(xcrun --sdk iphonesimulator --show-sdk-path) \
            --target x86_64-apple-ios16.0-simulator