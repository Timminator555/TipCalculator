name: Build iOS SwiftUI App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Compile SwiftUI App for iOS Simulator
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Swift Package via Xcodebuild
        run: |
          xcodebuild build \
            --package-path . \
            --scheme TipCalculatorApp-Package \
            --sdk iphonesimulator \
            --destination "generic/platform=iOS Simulator"